name = "FM-FAM"
id_prefix = "FM-1_77"            # plain dev builds only: release.sh sets the real identity (FM1B_ID, FM-1_8NN)
usb_manufacturer = "FM-FAM"
usb_product = "FM-FAM FM-1"
o2 = ["dsp.c"]
mirror = true
ble = true                       # Bluetooth, on fm1-base's own stack
ble_stack = "own"
ble_pairing = true               # pairing and an encrypted link (the bond kept)
bt_audio = true                  # the sound to headphones and speakers (A2DP)
bt_audio_sim = true              # the host simulator's stand-in for it
ram_layout = "packed"            # one SRAM budget: Bluetooth's buffers need the room
words = "words.tsv"
tagline = "a drum synth and sequencer for the FM-1"
licence = "MPL-2.0"
author = "FM-FAM"
description = "A two-oscillator voice with 16 oscillator types, sync, FM and a patch bay, a drum synth with its own sequencer, a 16-step sequencer with locks, a sound of its own for every pattern, an effects chain, random pages, scales, presets and projects."
tags = ["synth", "sequencer"]
